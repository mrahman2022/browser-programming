<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Budget</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Student Budget</h1>
    <p>Expense Tracker for International Students in Finland</p>
  </header>

  <main class="container">
    <section class="summary-grid">
      <div class="card summary-card">
        <h3>Income</h3>
        <p id="incomeTotal">€0.00</p>
      </div>
      <div class="card summary-card">
        <h3>Expenses</h3>
        <p id="expenseTotal">€0.00</p>
      </div>
      <div class="card summary-card">
        <h3>Balance</h3>
        <p id="balanceTotal">€0.00</p>
      </div>
      <div class="card summary-card">
        <h3>Top Expense Category</h3>
        <p id="topCategory">-</p>
      </div>
    </section>

    <section class="grid-two">
      <section class="card">
        <h2>Add Transaction</h2>
        <form id="transactionForm">
          <div class="form-grid">
            <input id="title" type="text" placeholder="Title" required />
            <input id="amount" type="number" placeholder="Amount" step="0.01" required />

            <select id="type" required>
              <option value="">Select Type</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>

            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Salary">Salary</option>
              <option value="Allowance">Allowance</option>
              <option value="Family Support">Family Support</option>
              <option value="Rent">Rent</option>
              <option value="Groceries">Groceries</option>
              <option value="Transport">Transport</option>
              <option value="Eating Out">Eating Out</option>
              <option value="Phone/Internet">Phone/Internet</option>
              <option value="Study Materials">Study Materials</option>
              <option value="Subscriptions">Subscriptions</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Travel">Travel</option>
              <option value="Other">Other</option>
            </select>

            <input id="date" type="date" required />

            <select id="paymentMethod">
              <option value="">Payment Method</option>
              <option value="Card">Card</option>
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
              <option value="MobilePay">MobilePay</option>
            </select>
          </div>

          <textarea id="note" rows="3" placeholder="Note (optional)"></textarea>
          <button type="submit">Save Transaction</button>
        </form>
      </section>

      <section class="card">
        <h2>Monthly Budget</h2>
        <form id="budgetForm">
          <div class="form-grid">
            <select id="budgetCategory" required>
              <option value="">Select Category</option>
              <option value="Groceries">Groceries</option>
              <option value="Transport">Transport</option>
              <option value="Eating Out">Eating Out</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Phone/Internet">Phone/Internet</option>
              <option value="Study Materials">Study Materials</option>
            </select>
            <input id="budgetAmount" type="number" placeholder="Budget Amount" step="0.01" required />
          </div>
          <button type="submit">Save Budget</button>
        </form>

        <div id="budgetList" class="budget-list"></div>
      </section>
    </section>

    <section class="card">
      <h2>Filters</h2>
      <div class="form-grid">
        <input id="monthFilter" type="month" />
        <select id="typeFilter">
          <option value="all">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select id="categoryFilter">
          <option value="all">All Categories</option>
        </select>
      </div>
    </section>

    <section class="grid-two">
      <section class="card">
        <h2>Transactions</h2>
        <div id="transactionList"></div>
      </section>

      <section class="card">
        <h2>Insights</h2>
        <canvas id="categoryChart"></canvas>
        <canvas id="incomeExpenseChart"></canvas>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
